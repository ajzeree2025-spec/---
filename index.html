ен адам аз ғана қосымша қиындыққа да шыдай алады.','Адам қанша асықса да, барлық нәрсе өз уақытымен болады; бұйырған несібе өзіне келеді.','Алдын ала сақтанып, қауіптің алдын алған дұрыс.','Қолайлы сәтті өткізіп алмай, істі уақытында орындау керек.','Батыл адам қиындықтан қорықпайды, ал қорқақ адам қауіптен үнемі үрейленіп жүреді.','Қауіптің қайдан келетінін білмейсің, сондықтан әрдайым сақ болу керек.','Адамдар көбіне өзіне мінезі, қызығушылығы немесе жағдайы ұқсас адамдармен араласады.','Өз мүмкіндігін бағаламай, шамасынан тыс іске кіріскен адам қиындыққа тап болады.'];

shuf(d.o).forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>{
